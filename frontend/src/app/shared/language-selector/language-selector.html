<button
  matIconButton
  type="button"
  class="language-selector-trigger"
  [matMenuTriggerFor]="menu"
  [attr.aria-label]="triggerLabel()"
>
  <lucide-icon class="language-selector-icon" name="Languages" aria-hidden="true" />
</button>

<mat-menu #menu="matMenu" aria-label="Content language">
  @for (option of options; track option.value) {
    <button
      mat-menu-item
      type="button"
      role="menuitemradio"
      [attr.aria-checked]="option.value === language()"
      (click)="select(option)"
    >
      @if (option.value === language()) {
        <lucide-icon matMenuItemIcon class="language-option-mark" name="Check" aria-hidden="true" />
      } @else {
        <span matMenuItemIcon class="language-option-mark" aria-hidden="true"></span>
      }
      <span [attr.lang]="option.value">{{ option.label }}</span>
    </button>
  }
</mat-menu>
